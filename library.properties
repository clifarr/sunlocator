paragraph=Computes the local time at which the sun reaches any elevation angle (the horizon, civil/nautical/astronomical twilight, or a custom angle) for a given date and location. Pure C++, no hardware or network dependencies, works on AVR, SAM, SAMD, ESP8266, ESP32, RP2040 and more. Ideal for switching lights, blinds or relays based on daylight.
